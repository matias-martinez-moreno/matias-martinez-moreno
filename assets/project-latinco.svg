<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="Latinco">
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace; }
    .in { }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .25s; } .a3 { animation-delay: .4s; }
    @keyframes up { from { opacity: .2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="270" spreadMethod="reflect">
      <stop offset="0" stop-color="#2563eb"/><stop offset=".5" stop-color="#3b82f6" stop-opacity=".15"/><stop offset="1" stop-color="#3b82f6" stop-opacity=".7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 270;0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#2563eb" stop-opacity=".14"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="clip"><rect width="600" height="270" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" class="sans">
    <rect width="600" height="270" fill="url(#bg)"/>
    <circle cx="80" cy="270" r="120" fill="#3b82f6" opacity=".08" filter="url(#blur)">
      <animate attributeName="opacity" values=".05;.12;.05" dur="7s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(90 135)"><g class="in a1">
      <circle r="62" fill="url(#halo)"/>
      <circle r="44" fill="#ffffff" stroke="#2563eb" stroke-opacity=".3" stroke-width="1.5"/>
      <circle r="52" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="10 9" stroke-opacity=".6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <g stroke-linecap="round"><rect x="-26" y="4" width="10" height="16" rx="2" fill="#2563eb" fill-opacity="0.45"><animate attributeName="height" values="6;16;6" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="14;4;14" dur="3s" begin="0s" repeatCount="indefinite"/></rect><rect x="-12" y="-6" width="10" height="26" rx="2" fill="#2563eb" fill-opacity="0.65"><animate attributeName="height" values="10;26;10" dur="3s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="10;-6;10" dur="3s" begin="0.2s" repeatCount="indefinite"/></rect><rect x="2" y="-14" width="10" height="34" rx="2" fill="#2563eb" fill-opacity="0.8"><animate attributeName="height" values="14;34;14" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="6;-14;6" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect><rect x="16" y="-22" width="10" height="42" rx="2" fill="#2563eb" fill-opacity="1"><animate attributeName="height" values="17;42;17" dur="3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="3;-22;3" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect></g>
    </g></g>
    <g class="in a2">
      <text class="mono" x="170" y="62" font-size="12" letter-spacing="3" fill="#2563eb">01</text>
      <text x="564" y="62" text-anchor="end" font-size="13" font-weight="600" fill="#94a3b8">Private project</text>
      <text x="170" y="108" font-size="32" font-weight="800" fill="#0f172a">Latinco</text>
    </g>
    <text class="in a3" x="170" y="144" font-size="18" fill="#475569"><tspan x="170" dy="0">Tender intelligence platform: monitors</tspan><tspan x="170" dy="26">public bids, compares prices item by</tspan><tspan x="170" dy="26">item and sends daily email alerts.</tspan></text>
    <g class="in a3"><g transform="translate(170 220)"><rect width="62" height="28" rx="14" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-opacity=".25"/><text x="31.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Flask</text></g><g transform="translate(240 220)"><rect width="46" height="28" rx="14" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-opacity=".25"/><text x="23.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">AWS</text></g><g transform="translate(294 220)"><rect width="92" height="28" rx="14" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-opacity=".25"/><text x="46.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Terraform</text></g><g transform="translate(394 220)"><rect width="69" height="28" rx="14" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-opacity=".25"/><text x="34.5" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Docker</text></g></g>
    
  </g>
  <rect x=".75" y=".75" width="598.5" height="268.5" rx="21.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect width="600" height="3" fill="#2563eb" opacity=".25"/>
    <rect width="180" height="3" fill="#2563eb"><animate attributeName="x" values="-180;600" dur="4s" repeatCount="indefinite"/></rect></g>
</svg>
