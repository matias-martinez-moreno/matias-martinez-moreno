<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Matías Martínez Moreno</title>
  <desc id="desc">Systems Engineering at EAFIT · Software, automation and AI · Medellín, Colombia</desc>
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .fade { opacity: 0; animation: fadeUp 1s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .7s; } .d4 { animation-delay: 1s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .role { opacity: 0; clip-path: inset(0 100% 0 0); animation: type 12s infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
    @keyframes type {
      0%   { opacity: 1; clip-path: inset(0 100% 0 0); animation-timing-function: steps(38, end); }
      14%  { opacity: 1; clip-path: inset(0 0 0 0); }
      28%  { opacity: 1; clip-path: inset(0 0 0 0); }
      33%  { opacity: 0; clip-path: inset(0 0 0 0); }
      100% { opacity: 0; }
    }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a13"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="950" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;700 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#ec4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1200 0;0 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#070a13" stop-opacity="0"/>
      <stop offset="1" stop-color="#070a13" stop-opacity=".85"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <!-- aurora -->
    <g filter="url(#blur)">
      <circle cx="220" cy="90" r="170" fill="#7c3aed" opacity=".55">
        <animateTransform attributeName="transform" type="translate" values="0 0;140 70;0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="300" r="190" fill="#0891b2" opacity=".5">
        <animateTransform attributeName="transform" type="translate" values="0 0;-160 -60;0 0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="20" r="130" fill="#db2777" opacity=".35">
        <animateTransform attributeName="transform" type="translate" values="0 0;-90 90;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#vignette)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle class="star" cx="90"   cy="60"  r="1.6" style="animation-delay:0s"/>
      <circle class="star" cx="180"  cy="300" r="1.2" style="animation-delay:.8s"/>
      <circle class="star" cx="330"  cy="40"  r="1.4" style="animation-delay:1.6s"/>
      <circle class="star" cx="470"  cy="330" r="1.1" style="animation-delay:.4s"/>
      <circle class="star" cx="820"  cy="50"  r="1.5" style="animation-delay:2.1s"/>
      <circle class="star" cx="960"  cy="110" r="1.2" style="animation-delay:1.2s"/>
      <circle class="star" cx="1110" cy="70"  r="1.7" style="animation-delay:.2s"/>
      <circle class="star" cx="1080" cy="320" r="1.3" style="animation-delay:2.6s"/>
      <circle class="star" cx="60"   cy="200" r="1.1" style="animation-delay:1.9s"/>
      <circle class="star" cx="1150" cy="210" r="1.2" style="animation-delay:.9s"/>
    </g>

    <!-- content -->
    <g class="sans" text-anchor="middle">
      <g class="fade d1">
        <text x="600" y="98" font-size="17" font-weight="600" letter-spacing="6" fill="#67e8f9">HI, I'M</text>
      </g>
      <g class="fade d2">
        <text x="600" y="172" font-size="66" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)">Matías Martínez Moreno</text>
      </g>
    </g>

    <g class="mono" font-size="24" text-anchor="middle" fill="#e2e8f0">
      <text class="role r1" x="600" y="232"><tspan fill="#a78bfa">❯ </tspan>Systems Engineering · EAFIT<tspan class="caret" fill="#22d3ee"> ▌</tspan></text>
      <text class="role r2" x="600" y="232"><tspan fill="#a78bfa">❯ </tspan>Software &amp; automation @ Latinco<tspan class="caret" fill="#22d3ee"> ▌</tspan></text>
      <text class="role r3" x="600" y="232"><tspan fill="#a78bfa">❯ </tspan>Exploring AI &amp; model training<tspan class="caret" fill="#22d3ee"> ▌</tspan></text>
    </g>

    <!-- pills -->
    <g class="sans fade d4" font-size="15" font-weight="600" text-anchor="middle">
      <g transform="translate(222 282)">
        <rect width="228" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".5"/>
        <circle cx="24" cy="20" r="5" fill="#a78bfa"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
        <text x="122" y="25" fill="#ede9fe">Medellín, Colombia</text>
      </g>
      <g transform="translate(466 282)">
        <rect width="268" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#22d3ee" stroke-opacity=".5"/>
        <circle cx="24" cy="20" r="5" fill="#22d3ee"><animate attributeName="r" values="4;6;4" dur="2s" begin=".6s" repeatCount="indefinite"/></circle>
        <text x="142" y="25" fill="#cffafe">AI &amp; Machine Learning</text>
      </g>
      <g transform="translate(750 282)">
        <rect width="228" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".5"/>
        <circle cx="24" cy="20" r="5" fill="#f472b6"><animate attributeName="r" values="4;6;4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
        <text x="122" y="25" fill="#fce7f3">Automation</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="url(#border)" stroke-width="2" stroke-opacity=".8"/>
</svg>
