<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Matías Martínez Moreno</title>
  <desc id="desc">Systems Engineering at EAFIT · Software, automation and AI · Medellín, Colombia</desc>
  <style>
    .sans { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .fade { }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .75s; }
    @keyframes up { from { opacity: .2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .role { opacity: 0; animation: type 12s infinite; }
    .r1 { opacity: 1; animation: type1 12s infinite; }
    @keyframes type1 { 0%, 29% { opacity: 1; } 33%, 100% { opacity: 0; } }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
    @keyframes type {
      0%   { opacity: 1; clip-path: inset(0 100% 0 0); animation-timing-function: steps(32, end); }
      13%  { opacity: 1; clip-path: inset(0 0 0 0); }
      29%  { opacity: 1; clip-path: inset(0 0 0 0); }
      33%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bar { }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#f8fafc"/>
    <rect width="1200" height="340" fill="url(#dots)"><animateTransform attributeName="transform" type="translate" values="0 0;24 24" dur="6s" repeatCount="indefinite"/></rect>
    <rect width="1200" height="4" fill="url(#accent)" opacity=".35"/>
    <rect width="320" height="4" fill="url(#accent)"><animate attributeName="x" values="-320;1200" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="19.5" fill="none" stroke="#e2e8f0"/>

  <g class="sans" text-anchor="middle">
    <text class="fade d1" x="600" y="92" font-size="14" font-weight="600" letter-spacing="5" fill="#64748b">SYSTEMS ENGINEERING · EAFIT</text>
    <text class="fade d2" x="600" y="160" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#0f172a">Matías Martínez Moreno</text>
  </g>
  <rect class="bar" x="560" y="182" width="80" height="3" rx="1.5" fill="url(#accent)"/>

  <g class="mono" font-size="20" text-anchor="middle" fill="#334155">
    <text class="role r1" x="600" y="228"><tspan fill="#2563eb">&gt; </tspan>Software development<tspan class="caret" fill="#2563eb"> _</tspan></text>
    <text class="role r2" x="600" y="228"><tspan fill="#2563eb">&gt; </tspan>Process automation<tspan class="caret" fill="#2563eb"> _</tspan></text>
    <text class="role r3" x="600" y="228"><tspan fill="#2563eb">&gt; </tspan>AI and model training<tspan class="caret" fill="#2563eb"> _</tspan></text>
  </g>

  <g class="sans fade d4" font-size="14" font-weight="500" text-anchor="middle" fill="#334155">
    <g transform="translate(312 262)"><rect width="180" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0"/><text x="90" y="23">Medellín, Colombia</text></g>
    <g transform="translate(510 262)"><rect width="180" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0"/><text x="90" y="23">AI &amp; Machine Learning</text></g>
    <g transform="translate(708 262)"><rect width="180" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0"/><text x="90" y="23">Automation</text></g>
  </g>
</svg>
