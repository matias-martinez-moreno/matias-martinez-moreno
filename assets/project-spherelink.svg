<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="270" viewBox="0 0 1208 270" role="img" aria-label="SphereLink">
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace; }
    .in { opacity: 0; animation: up .8s ease-out forwards; }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .25s; } .a3 { animation-delay: .4s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#080b14"/></linearGradient>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1208" y2="270" spreadMethod="reflect">
      <stop offset="0" stop-color="#34d399"/><stop offset=".5" stop-color="#10b981" stop-opacity=".15"/><stop offset="1" stop-color="#10b981" stop-opacity=".7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1208 270;0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#34d399" stop-opacity=".45"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="clip"><rect width="1208" height="270" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" class="sans">
    <rect width="1208" height="270" fill="url(#bg)"/>
    <circle cx="80" cy="270" r="120" fill="#10b981" opacity=".3" filter="url(#blur)">
      <animate attributeName="opacity" values=".18;.38;.18" dur="7s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(90 135)"><g class="in a1">
      <circle r="62" fill="url(#halo)"/>
      <circle r="44" fill="#0b1220" stroke="#34d399" stroke-opacity=".3" stroke-width="1.5"/>
      <circle r="52" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="10 9" stroke-opacity=".6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <g fill="none" stroke="#34d399" stroke-width="3.5"><circle r="20"/><ellipse rx="20" ry="7.5"/><ellipse rx="7.5" ry="20"/></g>
   <g transform="rotate(-25)"><ellipse rx="34" ry="11" fill="none" stroke="#34d399" stroke-opacity=".5" stroke-width="2"/>
   <circle r="4.5" fill="#34d399"><animateMotion dur="4s" repeatCount="indefinite" path="M34 0a34 11 0 1 1-68 0a34 11 0 1 1 68 0"/></circle></g>
    </g></g>
    <g class="in a2">
      <text class="mono" x="170" y="62" font-size="12" letter-spacing="3" fill="#34d399">05</text>
      <text x="1150" y="62" text-anchor="end" font-size="14" font-weight="600" fill="#e2e8f0">View repo</text><g class="arrow"><text x="1172" y="62" text-anchor="end" font-size="16" font-weight="700" fill="#34d399">→</text></g>
      <text x="170" y="108" font-size="32" font-weight="800" fill="#f8fafc">SphereLink</text>
    </g>
    <text class="in a3" x="170" y="144" font-size="18" fill="#a3b1c6"><tspan x="170" dy="0">Web platform to organize and manage academic, social and</tspan><tspan x="170" dy="26">wellness events within institutions.</tspan></text>
    <g class="in a3"><g transform="translate(170 220)"><rect width="69" height="28" rx="14" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".4"/><text x="34.5" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">Django</text></g><g transform="translate(247 220)"><rect width="69" height="28" rx="14" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".4"/><text x="34.5" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">Python</text></g><g transform="translate(324 220)"><rect width="69" height="28" rx="14" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".4"/><text x="34.5" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">Events</text></g></g>
    <g class="in a3"><line x1="780" y1="150" x2="860" y2="95" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><line x1="780" y1="150" x2="905" y2="190" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><line x1="860" y1="95" x2="985" y2="130" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><line x1="905" y1="190" x2="985" y2="130" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><line x1="985" y1="130" x2="1060" y2="200" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><line x1="985" y1="130" x2="1100" y2="105" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><line x1="860" y1="95" x2="950" y2="60" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><line x1="950" y1="60" x2="1100" y2="105" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><line x1="1060" y1="200" x2="1100" y2="105" stroke="#34d399" stroke-opacity=".22" stroke-width="1.5"/><circle cx="780" cy="150" r="5" fill="#0b1220" stroke="#34d399" stroke-width="2"/><circle cx="780" cy="150" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;16" dur="2.4s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="860" cy="95" r="5" fill="#0b1220" stroke="#34d399" stroke-width="2"/><circle cx="860" cy="95" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;16" dur="2.4s" begin="0.35s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="0.35s" repeatCount="indefinite"/></circle><circle cx="905" cy="190" r="5" fill="#0b1220" stroke="#34d399" stroke-width="2"/><circle cx="905" cy="190" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;16" dur="2.4s" begin="0.70s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="0.70s" repeatCount="indefinite"/></circle><circle cx="985" cy="130" r="5" fill="#0b1220" stroke="#34d399" stroke-width="2"/><circle cx="985" cy="130" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;16" dur="2.4s" begin="1.05s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="1.05s" repeatCount="indefinite"/></circle><circle cx="1060" cy="200" r="5" fill="#0b1220" stroke="#34d399" stroke-width="2"/><circle cx="1060" cy="200" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;16" dur="2.4s" begin="1.40s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="1.40s" repeatCount="indefinite"/></circle><circle cx="1100" cy="105" r="5" fill="#0b1220" stroke="#34d399" stroke-width="2"/><circle cx="1100" cy="105" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;16" dur="2.4s" begin="1.75s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="1.75s" repeatCount="indefinite"/></circle><circle cx="950" cy="60" r="5" fill="#0b1220" stroke="#34d399" stroke-width="2"/><circle cx="950" cy="60" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;16" dur="2.4s" begin="2.10s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="2.10s" repeatCount="indefinite"/></circle><circle r="3.5" fill="#34d399"><animateMotion dur="5s" repeatCount="indefinite" path="M780 150L860 95L985 130L1100 105L1060 200L905 190L780 150"/></circle></g>
  </g>
  <rect x="1" y="1" width="1206" height="268" rx="21" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
