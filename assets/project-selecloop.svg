<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="SelecLoop">
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace; }
    .in { opacity: 0; animation: up .8s ease-out forwards; }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .25s; } .a3 { animation-delay: .4s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#080b14"/></linearGradient>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="270" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#7c3aed" stop-opacity=".15"/><stop offset="1" stop-color="#7c3aed" stop-opacity=".7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 270;0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="clip"><rect width="600" height="270" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" class="sans">
    <rect width="600" height="270" fill="url(#bg)"/>
    <circle cx="80" cy="270" r="120" fill="#7c3aed" opacity=".3" filter="url(#blur)">
      <animate attributeName="opacity" values=".18;.38;.18" dur="7s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(90 135)"><g class="in a1">
      <circle r="62" fill="url(#halo)"/>
      <circle r="44" fill="#0b1220" stroke="#a78bfa" stroke-opacity=".3" stroke-width="1.5"/>
      <circle r="52" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="10 9" stroke-opacity=".6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <g fill="none" stroke="#a78bfa" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
   <path d="M-22 -5a23 23 0 0 1 41-10"/><path d="M21 -26v11h-11"/>
   <path d="M22 5a23 23 0 0 1-41 10"/><path d="M-21 26v-11h11"/>
   <animateTransform attributeName="transform" type="rotate" values="0;0;180;180" keyTimes="0;.6;.8;1" dur="5s" repeatCount="indefinite"/></g>
    </g></g>
    <g class="in a2">
      <text class="mono" x="170" y="62" font-size="12" letter-spacing="3" fill="#a78bfa">03</text>
      <text x="542" y="62" text-anchor="end" font-size="14" font-weight="600" fill="#e2e8f0">View repo</text><g class="arrow"><text x="564" y="62" text-anchor="end" font-size="16" font-weight="700" fill="#a78bfa">→</text></g>
      <text x="170" y="108" font-size="32" font-weight="800" fill="#f8fafc">SelecLoop</text>
    </g>
    <text class="in a3" x="170" y="144" font-size="18" fill="#a3b1c6"><tspan x="170" dy="0">Collaborative platform for anonymous</tspan><tspan x="170" dy="26">reviews of hiring processes, for</tspan><tspan x="170" dy="26">candidates and companies alike.</tspan></text>
    <g class="in a3"><g transform="translate(170 220)"><rect width="46" height="28" rx="14" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".4"/><text x="23.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#a78bfa">Web</text></g><g transform="translate(224 220)"><rect width="92" height="28" rx="14" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".4"/><text x="46.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#a78bfa">Community</text></g><g transform="translate(324 220)"><rect width="84" height="28" rx="14" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".4"/><text x="42.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#a78bfa">Feedback</text></g></g>
  </g>
  <rect x="1" y="1" width="598" height="268" rx="21" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
</svg>
