<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="Soufflé">
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace; }
    .in { opacity: 0; animation: up .8s ease-out forwards; }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .25s; } .a3 { animation-delay: .4s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#080b14"/></linearGradient>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="270" spreadMethod="reflect">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#db2777" stop-opacity=".15"/><stop offset="1" stop-color="#db2777" stop-opacity=".7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 270;0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#f472b6" stop-opacity=".45"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="clip"><rect width="600" height="270" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" class="sans">
    <rect width="600" height="270" fill="url(#bg)"/>
    <circle cx="80" cy="270" r="120" fill="#db2777" opacity=".3" filter="url(#blur)">
      <animate attributeName="opacity" values=".18;.38;.18" dur="7s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(90 135)"><g class="in a1">
      <circle r="62" fill="url(#halo)"/>
      <circle r="44" fill="#0b1220" stroke="#f472b6" stroke-opacity=".3" stroke-width="1.5"/>
      <circle r="52" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="10 9" stroke-opacity=".6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round">
   <path d="M-22 -16H0V16H22"/><path d="M0 0H22" stroke-opacity=".5"/></g>
   <g fill="#0b1220" stroke="#f472b6" stroke-width="3"><rect x="-32" y="-24" width="16" height="16" rx="4"/>
   <circle cx="26" cy="0" r="6"/><circle cx="26" cy="16" r="6"/></g>
   <circle r="3.5" fill="#f472b6"><animateMotion dur="2.4s" repeatCount="indefinite" path="M-16 -16H0V16H20"/></circle>
    </g></g>
    <g class="in a2">
      <text class="mono" x="170" y="62" font-size="12" letter-spacing="3" fill="#f472b6">02</text>
      <text x="564" y="62" text-anchor="end" font-size="13" font-weight="600" fill="#64748b">Private project</text>
      <text x="170" y="108" font-size="32" font-weight="800" fill="#f8fafc">Soufflé</text>
    </g>
    <text class="in a3" x="170" y="144" font-size="18" fill="#a3b1c6"><tspan x="170" dy="0">Booking and event automation: forms,</tspan><tspan x="170" dy="26">files and email working together to</tspan><tspan x="170" dy="26">manage rooms and availability.</tspan></text>
    <g class="in a3"><g transform="translate(170 220)"><rect width="130" height="28" rx="14" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".4"/><text x="65.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#f472b6">Power Automate</text></g><g transform="translate(308 220)"><rect width="62" height="28" rx="14" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".4"/><text x="31.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#f472b6">Forms</text></g><g transform="translate(378 220)"><rect width="62" height="28" rx="14" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".4"/><text x="31.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#f472b6">Email</text></g></g>
  </g>
  <rect x="1" y="1" width="598" height="268" rx="21" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
</svg>
