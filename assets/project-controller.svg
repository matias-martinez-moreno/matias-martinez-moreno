<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="Controller">
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace; }
    .in { }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .25s; } .a3 { animation-delay: .4s; }
    @keyframes up { from { opacity: .2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="270" spreadMethod="reflect">
      <stop offset="0" stop-color="#0d9488"/><stop offset=".5" stop-color="#14b8a6" stop-opacity=".15"/><stop offset="1" stop-color="#14b8a6" stop-opacity=".7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 270;0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#0d9488" stop-opacity=".14"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="clip"><rect width="600" height="270" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" class="sans">
    <rect width="600" height="270" fill="url(#bg)"/>
    <circle cx="80" cy="270" r="120" fill="#14b8a6" opacity=".08" filter="url(#blur)">
      <animate attributeName="opacity" values=".05;.12;.05" dur="7s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(90 135)"><g class="in a1">
      <circle r="62" fill="url(#halo)"/>
      <circle r="44" fill="#ffffff" stroke="#0d9488" stroke-opacity=".3" stroke-width="1.5"/>
      <circle r="52" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="10 9" stroke-opacity=".6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <g opacity="1"><rect x="-24" y="-22" width="48" height="12" rx="3" fill="none" stroke="#0d9488" stroke-width="2.5"/><circle cx="-15" cy="-16" r="2" fill="#0d9488"/><path d="M-6 -16H16" stroke="#0d9488" stroke-width="2" stroke-opacity=".5"/></g><g opacity="1"><rect x="-24" y="-6" width="48" height="12" rx="3" fill="none" stroke="#0d9488" stroke-width="2.5"/><circle cx="-15" cy="0" r="2" fill="#0d9488"/><path d="M-6 0H16" stroke="#0d9488" stroke-width="2" stroke-opacity=".5"/></g><g opacity="1"><rect x="-24" y="10" width="48" height="12" rx="3" fill="none" stroke="#0d9488" stroke-width="2.5"/><circle cx="-15" cy="16" r="2" fill="#0d9488"/><path d="M-6 16H16" stroke="#0d9488" stroke-width="2" stroke-opacity=".5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.4;.85;1" dur="5s" repeatCount="indefinite"/></g>
    </g></g>
    <g class="in a2">
      <text class="mono" x="170" y="62" font-size="12" letter-spacing="3" fill="#0d9488">02</text>
      <text x="542" y="62" text-anchor="end" font-size="14" font-weight="600" fill="#0f172a">View repo</text><g class="arrow"><text x="564" y="62" text-anchor="end" font-size="16" font-weight="700" fill="#0d9488">→</text></g>
      <text x="170" y="108" font-size="32" font-weight="800" fill="#0f172a">Controller</text>
    </g>
    <text class="in a3" x="170" y="144" font-size="18" fill="#475569"><tspan x="170" dy="0">Horizontal autoscaling on AWS: reads</tspan><tspan x="170" dy="26">CloudWatch metrics and scales EC2 out</tspan><tspan x="170" dy="26">or in using linear regression.</tspan></text>
    <g class="in a3"><g transform="translate(170 220)"><rect width="62" height="28" rx="14" fill="#0d9488" fill-opacity=".08" stroke="#0d9488" stroke-opacity=".25"/><text x="31.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#0d9488">boto3</text></g><g transform="translate(240 220)"><rect width="46" height="28" rx="14" fill="#0d9488" fill-opacity=".08" stroke="#0d9488" stroke-opacity=".25"/><text x="23.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#0d9488">AWS</text></g><g transform="translate(294 220)"><rect width="92" height="28" rx="14" fill="#0d9488" fill-opacity=".08" stroke="#0d9488" stroke-opacity=".25"/><text x="46.0" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#0d9488">Terraform</text></g><g transform="translate(394 220)"><rect width="69" height="28" rx="14" fill="#0d9488" fill-opacity=".08" stroke="#0d9488" stroke-opacity=".25"/><text x="34.5" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#0d9488">Locust</text></g></g>
    
  </g>
  <rect x=".75" y=".75" width="598.5" height="268.5" rx="21.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect width="600" height="3" fill="#0d9488" opacity=".25"/>
    <rect width="180" height="3" fill="#0d9488"><animate attributeName="x" values="-180;600" dur="4s" repeatCount="indefinite"/></rect></g>
</svg>
